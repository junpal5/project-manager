<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>팀 프로젝트 현황</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="stylesheet" href="dashboard-view.css" />
<style>
:root{
  --canvas:#ffffff;--surface-soft:#f0f2f5;
  --hairline:rgba(10,19,23,.14);--hairline-soft:rgba(10,19,23,.07);
  --ink-deep:#0a1317;--ink:#444950;--charcoal:#65676b;--slate:#8a8d91;
  --primary:#0064e0;--primary-deep:#0143b5;--primary-soft:rgba(0,100,224,.08);
  --ink-button:#0a1317;--success:#23a354;--danger:#d92027;
}
*,*::before,*::after{box-sizing:border-box}html,body{margin:0;padding:0}
body{min-height:100vh;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink-deep);background:var(--surface-soft)}
button,input,select{font:inherit}
input,select{color:var(--ink-deep);background:var(--canvas);border:1px solid var(--hairline);outline:none}
input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.shell{width:min(1400px,calc(100% - 32px));margin:16px auto 48px}
.hero{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:22px 26px;border-radius:32px;background:var(--canvas);border:1px solid var(--hairline-soft);margin-bottom:16px}
.brand{display:flex;gap:14px;align-items:center}
.brand-mark{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--ink-button);color:var(--canvas);font-size:16px;font-weight:800}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--primary);font-weight:700;margin-bottom:4px}
h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.04em}
.meta{font-size:13px;color:var(--charcoal);text-align:right;line-height:1.6}
.refresh{margin-top:6px;padding:7px 14px;border-radius:100px;border:1px solid var(--hairline);background:var(--canvas);font-size:13px;font-weight:700;cursor:pointer}
.notice{padding:40px 20px;text-align:center;color:var(--charcoal);font-size:14px;line-height:1.7;border-radius:24px;background:var(--canvas);border:1px solid var(--hairline-soft)}
.legend{margin-top:14px;font-size:12px;color:var(--slate);line-height:1.7}
@media(max-width:760px){.shell{width:calc(100% - 16px);margin:8px auto 24px}.hero{padding:16px;border-radius:24px}.meta{text-align:left}}
</style>
</head>
<body>
<div class="shell">
  <header class="hero">
    <div class="brand"><div class="brand-mark">PM</div><div><div class="eyebrow">Team Dashboard</div><h1>팀 프로젝트 현황</h1></div></div>
    <div class="meta"><div id="updatedAt">불러오는 중…</div><button class="refresh" type="button" onclick="load()">새로고침</button></div>
  </header>
  <main id="dash"><div class="notice">프로젝트 현황을 불러오는 중입니다…</div></main>
  <p class="legend">읽기 전용 화면입니다. 프로젝트 행을 누르면 단계 목록이 펼쳐집니다. <b>지연</b>은 진행·준비 상태인데 납품일이 지났거나 현재 단계의 예정일이 지난 경우에 표시됩니다. 60초마다 자동으로 새로고침됩니다.</p>
</div>
<script src="dashboard-view.js"></script>
<script>
function source(){
  const q=new URLSearchParams(location.search);
  let owner=q.get('owner')||'', repo=q.get('repo')||'';
  // GitHub Pages(owner.github.io/repo/)에서 열면 주소로부터 저장소를 추정
  if(!owner&&/\.github\.io$/i.test(location.hostname)){owner=location.hostname.split('.')[0];repo=repo||location.pathname.split('/').filter(Boolean)[0]||''}
  return {owner,repo,branch:q.get('branch')||'main',path:q.get('path')||'research-pm/projects/_dashboard.json'};
}
function fmt(v){const d=new Date(v);if(!v||Number.isNaN(d.getTime()))return '-';return new Intl.DateTimeFormat('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(d)}
async function load(){
  const s=source();const el=document.getElementById('dash');
  if(!s.owner||!s.repo){el.innerHTML='<div class="notice">저장소 정보가 없습니다.<br/>관리자에게 받은 <b>팀 대시보드 링크</b>로 접속해 주세요.</div>';document.getElementById('updatedAt').textContent='';return}
  const url=`https://raw.githubusercontent.com/${encodeURIComponent(s.owner)}/${encodeURIComponent(s.repo)}/${encodeURIComponent(s.branch)}/${s.path.split('/').map(encodeURIComponent).join('/')}?v=${Date.now()}`;
  try{
    const res=await fetch(url);
    if(res.status===404){el.innerHTML='<div class="notice">아직 공개된 현황이 없습니다.<br/>관리자가 프로젝트를 한 번 저장하면 이곳에 표시됩니다.</div>';document.getElementById('updatedAt').textContent='';return}
    if(!res.ok)throw new Error(res.status);
    const data=await res.json();
    PMDash.render(el,Array.isArray(data.projects)?data.projects:[]);
    document.getElementById('updatedAt').textContent=`관리자 마지막 반영: ${fmt(data.generatedAt)}`;
  }catch(e){
    console.warn(e);
    if(!el.querySelector('.dash-table'))el.innerHTML='<div class="notice">현황을 불러오지 못했습니다. 잠시 후 새로고침해 주세요.</div>';
  }
}
load();
setInterval(load,60000);
</script>
</body>
</html>
